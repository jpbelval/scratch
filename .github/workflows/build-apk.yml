name: Build ScratchFade APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scratchfade-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ScratchFade

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install required Android SDK packages
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK exists and is non-empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ScratchFade-debug-apk
          path: ScratchFade/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
